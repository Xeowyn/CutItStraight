<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a232a">
<title>Cut It Straight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c8965c'/%3E%3Cpath d='M8 26 L14 6 L18 6 L24 26' stroke='%237df0ff' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1a232a;
    /* Long-press selection and the iOS callout both interfere with dragging. */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    /* Stops the browser hijacking drags for scroll/zoom. */
    touch-action: none;
  }
  /* Read by main.js to keep HUD clear of notches and the dynamic island inside the
     CrazyGames mobile app, which renders fullscreen. */
  #safe-probe {
    position: fixed;
    top: 0; left: 0;
    width: 0; height: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    pointer-events: none;
    visibility: hidden;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfe3f0;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.08em;
    background: #1a232a;
    transition: opacity 0.35s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  /* The CrazyGames SDK injects its ad overlay at z-index 10000 with pointer-events
     on, which sits above the canvas — so a canvas-drawn skip button can never be
     clicked. This one is real DOM, above that overlay. Dev/localhost only; main.js
     never unhides it on a CrazyGames host. */
  #devskip {
    position: fixed;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    z-index: 2147483647;
    padding: 18px 40px;
    border: 2px solid #7df0ff;
    border-radius: 14px;
    background: rgba(10, 16, 22, 0.94);
    color: #7df0ff;
    font: 800 15px/1 Inter, system-ui, sans-serif;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  #devskip:active { transform: translateX(-50%) translateY(2px); }
  /* Shown when the game cannot run. DOM rather than canvas on purpose: if the canvas
     is what broke, a canvas-drawn message would never appear. */
  #fatal {
    position: fixed;
    inset: 0;
    z-index: 2147483646;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    background: rgba(10, 14, 19, 0.97);
    color: #cfe3f0;
  }
  .fatal-title { font-size: 26px; font-weight: 900; color: #ffd873; }
  .fatal-detail { font-size: 15px; font-weight: 600; max-width: 30em; line-height: 1.5; opacity: 0.85; }
  .fatal-btn {
    margin-top: 8px;
    padding: 13px 30px;
    border: 0;
    border-radius: 14px;
    background: #2fae5e;
    color: #fff;
    font: 800 15px/1 Inter, system-ui, sans-serif;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe-probe"></div>
<div id="boot">LOADING…</div>
<button id="devskip" hidden>DEV: SKIP AD</button>
<!-- Boot watchdog. Plain script, NOT a module, so it runs even if the module graph
     fails to evaluate. A bare "LOADING..." that never clears tells nobody anything;
     this turns any hang or load failure into an on-screen diagnosis. -->
<script>
(function () {
  var boot = document.getElementById('boot');
  var problems = [];
  function note(msg) {
    if (msg && problems.indexOf(msg) === -1) problems.push(msg);
  }
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') note('Failed to load ' + (e.target.src || 'a script'));
    else note(e && e.message ? e.message : 'Script error');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    note('Unhandled: ' + ((e.reason && (e.reason.message || e.reason)) || 'promise rejection'));
  });

  window.__bootFailed = function (msg) { note(msg); show(); };

  function show() {
    if (!boot || boot.dataset.failed) return;
    boot.dataset.failed = '1';
    boot.classList.remove('gone');
    boot.innerHTML = '';
    var t = document.createElement('div');
    t.className = 'fatal-title';
    t.textContent = "Couldn't start";
    var d = document.createElement('div');
    d.className = 'fatal-detail';
    d.textContent = problems.length
      ? problems.slice(0, 3).join(' | ')
      : 'The game stopped while loading. A hard reload (Ctrl+Shift+R) usually fixes this.';
    // The address matters: opened as a file:// URL, or from a host that is neither
    // localhost nor CrazyGames, the SDK behaves differently. Showing it turns
    // "it does not work" into something diagnosable.
    var where = document.createElement('div');
    where.className = 'fatal-detail';
    where.style.opacity = '0.55';
    where.style.fontSize = '12px';
    where.textContent = location.href;
    var btn = document.createElement('button');
    btn.className = 'fatal-btn';
    btn.textContent = 'RELOAD';
    btn.onclick = function () { location.reload(true); };
    boot.style.flexDirection = 'column';
    boot.style.gap = '14px';
    boot.style.padding = '24px';
    boot.style.textAlign = 'center';
    boot.append(t, d, where, btn);
  }

  // If the game has not signalled ready in 12s, say so rather than spinning forever.
  setTimeout(function () { if (!window.__gameReady) show(); }, 12000);
})();
</script>
<script type="module">
  import('./src/main.js').catch(function (err) {
    window.__bootFailed('Module load failed: ' + (err && err.message ? err.message : err));
  });
</script>
</body>
</html>
